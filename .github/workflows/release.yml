name: Release

# Compila los binarios de Scene Cut Batch para Windows, macOS y Linux.
# PyInstaller no compila cruzado: cada SO se construye en su propio runner.
#
# Disparadores:
#   - push de un tag v* (ej. v0.1.0) -> compila y publica un GitHub Release
#   - workflow_dispatch (manual, pide version) -> solo compila y sube artifacts
#
# NOTA: todas las expresiones condicionales llevan ${{ }} explicito.
# GitHub rechaza el parser los if sin braces con comillas dobles dentro.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (empty = pyproject.toml version)"
        required: false
        default: ""

permissions:
  contents: write # necesario para publicar GitHub Releases

jobs:
  build:
    name: "Build ${{ matrix.platform }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # un SO fallando no cancela los demas
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "scenedetect[opencv]"
          pip install pyinstaller

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="$(python -c 'import pathlib,tomllib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          fi
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Build binary (PyInstaller)
        run: pyinstaller scenecutbatch.spec --clean --noconfirm

      - name: Smoke test binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/scenecutbatch.exe --version
          else
            ./dist/scenecutbatch --version
          fi

      - name: Package portable zip
        shell: bash
        run: |
          python scripts/make_release.py \
            --version "${{ steps.version.outputs.VERSION }}" \
            --platform "${{ matrix.platform }}"

      - name: Package .deb (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.VERSION }}"
          mkdir -p packaging/debian/usr/lib/python3/dist-packages
          cp -r src/scenecutbatch packaging/debian/usr/lib/python3/dist-packages/
          find packaging/debian/usr/lib -name '__pycache__' -type d -prune -exec rm -rf {} +
          sed -i "s/^Version: .*/Version: ${VER}/" packaging/debian/DEBIAN/control
          chmod 755 packaging/debian/DEBIAN/postinst packaging/debian/usr/bin/scenecutbatch
          dpkg-deb --build packaging/debian "releases/SceneCutBatch-${VER}-Linux-x86_64.deb"

      - name: Package AppImage (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          chmod +x packaging/appimage/build_appimage.sh
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            packaging/appimage/build_appimage.sh \
            "${{ steps.version.outputs.VERSION }}" dist/scenecutbatch

      - name: Package .app bundle (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.VERSION }}"
          APP="SceneCutBatch.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" releases
          cp dist/scenecutbatch "$APP/Contents/MacOS/scenecutbatch"
          cp assets/logo.png "$APP/Contents/Resources/logo.png"
          # icono .icns via iconset + iconutil (sips -s format icns no es fiable)
          ICONSET="logo.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/logo.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
          done
          sips -z 32 32 assets/logo.png --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 64 64 assets/logo.png --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 256 256 assets/logo.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 512 512 assets/logo.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/scenecutbatch.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>SceneCutBatch</string>
            <key>CFBundleDisplayName</key><string>Scene Cut Batch</string>
            <key>CFBundleIdentifier</key><string>com.scenecutbatch.app</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleExecutable</key><string>scenecutbatch</string>
            <key>CFBundleIconFile</key><string>scenecutbatch.icns</string>
          </dict>
          </plist>
          PLIST
          ditto -c -k --sequesterRsrc --keepParent "$APP" "releases/SceneCutBatch-${VER}-macOS-AppBundle.zip"
          echo "Bundle macOS creado: releases/SceneCutBatch-${VER}-macOS-AppBundle.zip"
          ls -la releases/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "SceneCutBatch-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}"
          path: |
            releases/*.zip
            releases/*.deb
            releases/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release with all platforms
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.AppImage
          generate_release_notes: true
