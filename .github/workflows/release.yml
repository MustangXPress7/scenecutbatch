name: Release

# Compila los binarios de Scene Cut Batch para Windows, macOS y Linux.
# PyInstaller no compila cruzado: cada SO se construye en su propio runner.
#
# Disparadores:
#   - push de un tag v* (ej. v0.1.0) -> compila y publica un GitHub Release
#   - workflow_dispatch (manual, pide version) -> solo compila y sube artifacts
#
# NOTA: todas las expresiones condicionales llevan ${{ }} explicito.
# GitHub rechaza el parser los if sin braces con comillas dobles dentro.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (empty = pyproject.toml version)"
        required: false
        default: ""

permissions:
  contents: write # necesario para publicar GitHub Releases

jobs:
  build:
    name: "Build ${{ matrix.platform }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # un SO fallando no cancela los demas
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "scenedetect[opencv]"
          pip install pyinstaller

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="$(python -c 'import pathlib,tomllib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          fi
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Build binary (PyInstaller)
        run: pyinstaller scenecutbatch.spec --clean --noconfirm

      - name: Smoke test binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/scenecutbatch.exe --version
          else
            ./dist/scenecutbatch --version
          fi

      - name: Prepare Windows executable for release
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.VERSION }}"
          mkdir -p releases
          cp dist/scenecutbatch.exe "releases/scenecutbatch-${VER}-windows-x86_64.exe"
          ( cd releases && sha256sum "scenecutbatch-${VER}-windows-x86_64.exe" > "scenecutbatch-${VER}-windows-x86_64.exe.sha256" )
          echo "Windows executable preparado: releases/scenecutbatch-${VER}-windows-x86_64.exe"
          ls -la releases/

      - name: Prepare macOS executable for release
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.VERSION }}"
          mkdir -p releases
          # Copiar el ejecutable de PyInstaller y empaquetarlo como .app.zip
          # para que la fórmula de Homebrew pueda descargarlo.
          APP_DIR="SceneCutBatch.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources" releases
          cp dist/scenecutbatch "$APP_DIR/Contents/MacOS/scenecutbatch"
          cp assets/logo.png "$APP_DIR/Contents/Resources/logo.png"
          # Icono .icns para macOS
          ICONSET="logo.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/logo.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
          done
          sips -z 32 32 assets/logo.png --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 64 64 assets/logo.png --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 256 256 assets/logo.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 512 512 assets/logo.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "$APP_DIR/Contents/Resources/scenecutbatch.icns"
          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>SceneCutBatch</string>
            <key>CFBundleDisplayName</key><string>Scene Cut Batch</string>
            <key>CFBundleIdentifier</key><string>com.scenecutbatch.app</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleExecutable</key><string>scenecutbatch</string>
            <key>CFBundleIconFile</key><string>scenecutbatch.icns</string>
          </dict>
          </plist>
          PLIST
          # Determinar nombre del archivo según arquitectura
          if [ "$(uname -m)" = "arm64" ]; then
            ARCH_SUFFIX="aarch64"
          else
            ARCH_SUFFIX="x86_64"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "releases/scenecutbatch-${VER}-macos-${ARCH_SUFFIX}.app.zip"
          ( cd releases && shasum -a 256 "scenecutbatch-${VER}-macos-${ARCH_SUFFIX}.app.zip" > "scenecutbatch-${VER}-macos-${ARCH_SUFFIX}.app.zip.sha256" )
          echo "macOS app bundle preparado: releases/scenecutbatch-${VER}-macos-${ARCH_SUFFIX}.app.zip"
          ls -la releases/

      - name: Upload release artifacts (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: "SceneCutBatch-${{ steps.version.outputs.VERSION }}-macos"
          path: |
            releases/*.app.zip
            releases/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release with all platforms
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.app.zip
            artifacts/*.sha256
          generate_release_notes: true
