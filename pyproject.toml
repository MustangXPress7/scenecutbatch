[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scenecutbatch"
version = "0.1.0"
description = "Batch scene-cut detection that emits FCP7 XML (xmeml) with virtual subclips, importable by professional video editors."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "scenedetect[opencv]>=0.6.3,<0.7",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gui = ["gradio>=4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
scenecutbatch = "scenecutbatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
